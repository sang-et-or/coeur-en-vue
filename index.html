<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{height:100%}</style>
</head>
<body>
<title>Cœur-en-vue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@600&display=swap">
<style>
/* Layout : appli une colonne, mobile d'abord. Scène illustrée en haut, chat + feuille de jeu en bas. Univers « dîner de nuit » assumé, thème sombre unique. */
:root{
  --night:#140d22; --plum:#22153a; --surface:#2c1d47; --surface2:#382658; --line:rgba(247,239,231,.13);
  --ink:#f7efe7; --muted:#b9a9cb; --candle:#ffbf66; --a:#ff9b6a; --b:#5fe0cf; --cupid:#c9abff; --ok:#8af0b5; --warn:#ffd36b; --wine:#8e2346;
  --on-light:#1b1129;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#3a1f55 0,transparent 60%),var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cupid);outline-offset:2px}
#app{max-width:460px;margin:0 auto;height:100%;position:relative}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding-block:14px 24px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--candle);color:var(--on-light)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--warn);background:rgba(255,211,107,.1);border:1px solid rgba(255,211,107,.35);padding:4px 10px;border-radius:999px}
.hint{color:var(--muted);font-size:13px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* ---------- Accueil ---------- */
.home{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.lens{width:150px;height:96px;margin-top:8px}
.lens .ca{animation:inL 1.1s cubic-bezier(.2,.9,.2,1) both}
.lens .cb{animation:inR 1.1s cubic-bezier(.2,.9,.2,1) both}
.lens .core{animation:glow 1.1s .7s both}
@keyframes inL{from{transform:translateX(-50px);opacity:0}}
@keyframes inR{from{transform:translateX(50px);opacity:0}}
@keyframes glow{from{opacity:0}}
.wordmark{font-size:clamp(46px,14vw,64px);font-weight:800;line-height:.9;letter-spacing:-.03em}
.wordmark span{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
.wordmark em{font-style:normal;font-weight:400;color:var(--candle)}
@keyframes rise{from{transform:translateY(40%) rotate(6deg);opacity:0}}
.slogan{font-family:var(--f-hand);font-size:26px;color:var(--cupid);margin-top:-6px;animation:rise .8s .6s both}
.pitch{color:var(--muted);max-width:36ch;margin:0;animation:rise .8s .75s both}
.duo{display:flex;gap:12px;width:100%;animation:rise .8s .9s both}
.mini-card{flex:1;min-width:0;background:var(--surface);border-radius:20px;padding:10px;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.mini-card .av{width:44px;height:44px;border-radius:50%;flex:none}
.mini-card b{display:block;font-family:var(--f-display)}
.mini-card small{color:var(--muted);font-size:12px}
.mini-card:first-child{transform:rotate(-2deg)}.mini-card:last-child{transform:rotate(2deg)}
.panel{width:100%;box-sizing:border-box;background:var(--plum);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;animation:rise .8s 1s both}
.panel h3{font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--night);padding:4px;border-radius:16px}
.seg button{padding:10px 8px;border-radius:12px;font-size:13px;line-height:1.25;text-align:left;color:var(--muted)}
.seg button b{display:block;color:var(--ink);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--cupid)}
.home .btn.primary{width:100%;font-size:17px;min-height:54px;animation:rise .8s 1.15s both}
.legal{font-size:12px;color:var(--muted)}

/* ---------- Profil & match ---------- */
.profile{display:flex;flex-direction:column;gap:14px}
.pcard{position:relative;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);animation:cardIn .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes cardIn{from{transform:translateY(30px) rotate(-3deg);opacity:0}}
.pcard .photo{position:relative;aspect-ratio:1/1;max-width:100%}
.pcard .photo svg{width:100%;height:100%;display:block}
.pcard .photo .sim{position:absolute;left:12px;top:12px}
.pcard .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{font-size:30px}
.pcard h2 small{font-weight:400;color:var(--muted);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.actions{display:flex;gap:10px}.actions .btn{flex:1}
.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}}
.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(20,13,34,.94);padding:24px;box-sizing:border-box;backdrop-filter:blur(6px)}
.match-lens{width:220px;height:140px}
.match-lens .ma{animation:inL 1s cubic-bezier(.2,.9,.2,1) both}
.match-lens .mb{animation:inR 1s cubic-bezier(.2,.9,.2,1) both}
.match-title{font-size:40px;font-weight:800;line-height:1}
.match-title em{font-style:normal;color:var(--candle);font-weight:400}
.invite{background:var(--surface);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;box-sizing:border-box;border:1px solid var(--line)}
.invite .meta{display:flex;flex-wrap:wrap;gap:6px}
.ok-line{font-size:13px;color:var(--ok)}

/* ---------- Salle ---------- */
.room{display:flex;flex-direction:column;height:100%;padding-block:8px;box-sizing:border-box;gap:8px}
.topbar{display:flex;align-items:center;gap:8px;flex:none}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface)}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.iconbtn.on{box-shadow:inset 0 0 0 1.5px var(--cupid)}
.viewer{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--surface);font-size:13px;min-width:0}
.viewer .av{width:30px;height:30px;border-radius:50%;flex:none}
.viewer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.stage{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.stage i{height:4px;border-radius:4px;background:var(--surface2);display:block;transition:background .6s}
.stage.done i{background:var(--candle)}.stage.cur{color:var(--ink)}.stage.cur i{background:linear-gradient(90deg,var(--candle),var(--cupid))}

.scene{position:relative;height:clamp(196px,34vh,280px);border-radius:24px;overflow:hidden;flex:none;isolation:isolate}
.scene>*{position:absolute}
.wall{inset:0;background:linear-gradient(#4a2554,#2a1638 70%);transition:background 1s}
.o{display:none}
.sc-resto .o-resto,.sc-terrasse .o-terrasse,.sc-cuisine .o-cuisine,.sc-karaoke .o-karaoke{display:block}
.window{top:12%;left:50%;transform:translateX(-50%);width:44%;height:44%;border-radius:999px 999px 6px 6px;background:linear-gradient(#141238,#3b2a6e);border:5px solid #5a3366;overflow:hidden;z-index:1}
.window i{position:absolute;width:3px;height:3px;border-radius:1px;background:#ffd98c;opacity:.85;animation:twk 3s infinite}
.window:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#5a3366 48% 52%,transparent 52%)}
@keyframes twk{50%{opacity:.3}}
.garland{top:6px;left:0;right:0;height:30px;z-index:2;display:flex;justify-content:space-around;align-items:flex-start;padding:0 8%}
.garland:before{content:"";position:absolute;left:0;right:0;top:-12px;height:30px;border-bottom:1.5px solid rgba(255,255,255,.25);border-radius:0 0 50% 50%}
.garland b{width:7px;height:9px;border-radius:50% 50% 45% 45%;background:var(--candle);box-shadow:0 0 10px 2px rgba(255,191,102,.6);margin-top:calc(var(--d)*1px);animation:bulb 2.4s infinite;animation-delay:calc(var(--i)*-.3s)}
@keyframes bulb{50%{opacity:.55;box-shadow:0 0 4px 1px rgba(255,191,102,.3)}}
.sky{inset:0;background:radial-gradient(circle at 80% 22%,#fff8dc 0 12px,rgba(255,248,220,.25) 13px 22px,transparent 23px),linear-gradient(#0b1030,#2a1f5a 70%,#4b2d6e);z-index:1}
.sky i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twk 2.5s infinite}
.sky .shoot{width:60px;height:2px;background:linear-gradient(90deg,transparent,#fff);top:18%;left:10%;transform:rotate(-18deg);animation:shoot 5s 1s infinite;opacity:0}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}5%{opacity:1}15%{opacity:0;transform:translate(160px,50px) rotate(-18deg)}100%{opacity:0}}
.kitchen{inset:0;z-index:1;background:linear-gradient(transparent 62%,#7d8b94 62% 64%,transparent 64%),repeating-linear-gradient(90deg,transparent 0 23px,rgba(0,0,0,.08) 23px 24px),repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.08) 23px 24px),linear-gradient(#e7eef0,#c7d3d7)}
.kitchen .pan{position:absolute;top:18%;width:34px;height:34px;border-radius:50%;background:#3b3f46;box-shadow:inset 0 0 0 4px #565c66}
.kitchen .pan:after{content:"";position:absolute;left:50%;top:-16px;width:4px;height:16px;background:#565c66;transform:translateX(-50%)}
.kitchen .steam{position:absolute;width:10px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(4px);animation:steam 2.4s infinite}
@keyframes steam{from{transform:translateY(0) scaleX(1);opacity:.8}to{transform:translateY(-30px) scaleX(2);opacity:0}}
.neon{inset:0;z-index:1;background:radial-gradient(circle at 20% 80%,rgba(255,64,200,.35),transparent 40%),radial-gradient(circle at 85% 70%,rgba(64,220,255,.35),transparent 40%),#1a0b2e}
.neon b{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.12em;color:#ffd1f4;text-shadow:0 0 6px #ff4fd8,0 0 18px #ff4fd8,0 0 30px #ff4fd8;animation:neon 3s infinite}
@keyframes neon{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.4}52%{opacity:1}}
.neon .ball{position:absolute;top:2%;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:conic-gradient(#ddd,#888,#fff,#999,#eee,#777,#ddd);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.seat{bottom:29%;width:66px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;animation:sway 5s ease-in-out infinite}
.seat.l{left:5%}.seat.r{right:5%;animation-delay:-2.5s}
.seat .av{width:62px;height:62px;border-radius:50%;box-shadow:0 0 0 3px var(--ring),0 8px 18px rgba(0,0,0,.35)}
.seat.l{--ring:var(--a)}.seat.r{--ring:var(--b)}
.seat .tag{font-size:11px;font-weight:600;background:rgba(20,13,34,.75);padding:1px 8px;border-radius:999px;white-space:nowrap}
.seat .tag em{font-style:normal;color:var(--candle)}
@keyframes sway{50%{transform:translateY(-3px)}}
.stain{position:absolute;bottom:22px;left:50%;width:22px;height:16px;margin-left:-4px;background:var(--wine);border-radius:60% 40% 55% 45%;opacity:0;transform:scale(.2);transition:all .5s}
.stain.on{opacity:.95;transform:scale(1)}
.table{left:-6%;right:-6%;bottom:-8%;height:40%;z-index:4;background:radial-gradient(60% 70% at 50% 30%,#fff3e0,transparent 70%),linear-gradient(#f2e2cf,#cdb398);border-radius:50% 50% 0 0/45% 45% 0 0;transition:background 1s}
.sc-cuisine .table{background:linear-gradient(#e3e8eb,#9aa7af)}
.sc-karaoke .table{background:radial-gradient(60% 70% at 50% 30%,#5d3b85,transparent 70%),linear-gradient(#3d2460,#24123b)}
.sc-terrasse .table{background:radial-gradient(60% 70% at 50% 30%,#fff3e0,transparent 70%),linear-gradient(#d8c8b6,#9f8a74)}
.plate{bottom:5%;width:68px;height:20px;margin-left:-34px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 5px #efe6dc,0 2px 4px rgba(0,0,0,.15);z-index:5}
.plate.pl{left:24%}.plate.pr{left:76%}
.glass{bottom:13%;width:22px;height:40px;margin-left:-11px;z-index:5;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.glass svg{width:100%;height:100%;display:block}
.glass.gl{left:37%}.glass.gr{left:63%}
.clink .gl{transform:translate(26px,-6px) rotate(14deg)}
.clink .gr{transform:translate(-26px,-6px) rotate(-14deg)}
.candle{left:50%;bottom:12%;width:12px;height:28px;margin-left:-6px;background:linear-gradient(#fff8ec,#e9d8c0);border-radius:3px;z-index:9}
.flame{position:absolute;left:50%;bottom:100%;width:10px;height:18px;margin-left:-5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff 0 20%,#ffd36b 40%,#ff9b3d 75%);box-shadow:0 0 20px 8px rgba(255,180,90,.45),0 0 60px 26px rgba(255,170,80,.18);animation:flick 1.6s infinite;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.06,.94) rotate(2deg)}60%{transform:scale(.95,1.08) rotate(-1deg)}}
.phone{left:13%;bottom:13%;width:22px;height:36px;border-radius:5px;background:#16131f;border:2px solid #555;z-index:6;transform:rotate(-12deg);display:none;align-items:center;justify-content:center}
.phone span{font-size:6px;color:#fff;writing-mode:vertical-rl;letter-spacing:.05em}
.phone.ring{display:flex;animation:buzz .12s infinite;box-shadow:0 0 0 3px rgba(138,240,181,.5)}
@keyframes buzz{50%{transform:rotate(-6deg) translateX(1px)}}
.dish{left:50%;bottom:0;transform:translateX(-50%) scale(0);font-size:28px;z-index:6;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.dish.on{transform:translateX(-50%) scale(1)}
.waiter{right:-34%;bottom:8%;height:74%;z-index:6;transition:right .9s cubic-bezier(.4,.1,.2,1)}
.waiter svg{height:100%;display:block}
.waiter.in{right:3%}
.waiter.trip svg{animation:trip .8s}
@keyframes trip{30%{transform:rotate(-14deg) translateX(-8px)}60%{transform:rotate(6deg)}100%{transform:none}}
.splash{right:14%;bottom:36%;z-index:7;width:60px;height:60px;pointer-events:none}
.splash i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--wine);opacity:0}
.splash.go i{animation:drop .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes drop{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.dark{inset:0;background:#05030a;opacity:0;z-index:8;pointer-events:none;transition:opacity .8s}
.dark.on{opacity:.9}
.cupid{top:8px;left:8px;width:56px;height:56px;z-index:10;animation:bob 3s ease-in-out infinite}
.cupid svg{width:100%;height:100%;overflow:visible}
.cupid .wing{transform-origin:32px 30px;animation:flap .5s ease-in-out infinite alternate}
.cupid .wing.r{animation-delay:-.25s}
@keyframes flap{to{transform:scaleY(.65)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.cupid .sleepeyes,.cupid .zzz{display:none}
.cupid.sleep{animation:none}
.cupid.sleep .wing{animation:none}
.cupid.sleep .eyes{display:none}.cupid.sleep .sleepeyes{display:block}
.cupid .zzz{position:absolute;right:-10px;top:-6px;font-family:var(--f-hand);font-size:18px;color:var(--cupid);animation:zz 2s infinite}
.cupid.sleep .zzz{display:block}
@keyframes zz{from{transform:translateY(4px);opacity:0}50%{opacity:1}to{transform:translateY(-8px);opacity:0}}
.bubble{top:14px;left:70px;max-width:min(62%,260px);z-index:11;background:var(--cupid);color:var(--on-light);font-family:var(--f-hand);font-size:18px;line-height:1.1;padding:6px 12px;border-radius:14px 14px 14px 4px;opacity:0;transform:translateY(-6px) scale(.9);transform-origin:0 0;transition:all .3s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.place{top:10px;right:12px;z-index:10;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,239,231,.75);background:rgba(20,13,34,.45);padding:3px 8px;border-radius:999px}
.fx{inset:0;z-index:12;pointer-events:none}
.fx i{position:absolute;width:8px;height:8px;border-radius:2px;animation:pop 1.1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(0,0) rotate(0) scale(1)}to{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg) scale(.5)}}
.flash{animation:flash .9s}
@keyframes flash{0%{filter:brightness(1)}20%{filter:brightness(1.8)}100%{filter:brightness(1)}}

.lower{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
.msg{max-width:82%;animation:msgIn .3s cubic-bezier(.2,.9,.2,1) both}
@keyframes msgIn{from{transform:translateY(8px);opacity:0}}
.msg p{margin:0;padding:8px 12px;border-radius:18px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end}
.msg.me p{border-bottom-right-radius:6px;color:var(--on-light)}
.msg.me.pA p{background:var(--a)}.msg.me.pB p{background:var(--b)}
.msg.them{align-self:flex-start}
.msg.them p{background:var(--surface2);border-bottom-left-radius:6px}
.msg.them.pA p{box-shadow:inset 3px 0 0 var(--a)}.msg.them.pB p{box-shadow:inset 3px 0 0 var(--b)}
.msg .who{font-size:11px;color:var(--muted);margin-left:10px}
.msg.cup{align-self:stretch;max-width:100%;display:flex;gap:8px;align-items:flex-start}
.msg.cup .mini{width:26px;height:26px;flex:none}
.msg.cup .mini svg{width:100%;height:100%}
.msg.cup>div{flex:1;min-width:0;background:rgba(201,171,255,.1);border:1px dashed rgba(201,171,255,.4);border-radius:14px;padding:6px 10px}
.msg.cup b{font-size:11px;color:var(--cupid);letter-spacing:.06em;text-transform:uppercase}
.msg.cup div p{padding:0;font-size:14px}
.msg.sys{align-self:center;max-width:92%;text-align:center;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.typing{align-self:flex-start;font-size:12px;color:var(--muted);padding:4px 10px}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-left:3px;animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-4px)}}
.suggest{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:none;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest button{flex:none;font-size:12.5px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inputbar{display:flex;gap:6px;align-items:center;flex:none}
.inputbar input{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit}
.inputbar .send{width:44px;height:44px;border-radius:50%;background:var(--candle);color:var(--on-light);font-size:18px;flex:none}
.missionbar{flex:none;background:linear-gradient(90deg,rgba(201,171,255,.18),rgba(255,191,102,.12));border:1px solid rgba(201,171,255,.4);border-radius:16px;padding:8px 10px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.missionbar .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.missionbar .t{font-variant-numeric:tabular-nums;font-weight:600}
.word{padding:2px 8px;border-radius:999px;background:var(--surface);font-size:12px}
.word.ok{background:var(--ok);color:var(--on-light);animation:wpop .4s}
@keyframes wpop{50%{transform:scale(1.25)}}
.backgame{align-self:center;flex:none;margin-bottom:6px}

.sheet{position:absolute;left:-2px;right:-2px;bottom:0;max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;box-sizing:border-box;z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.4);animation:sheetIn .35s cubic-bezier(.2,.9,.2,1) both;display:flex;flex-direction:column;gap:12px}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kicker{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cupid);font-weight:600}
.sheet h3{font-size:22px;line-height:1.1}
.sheet p{margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:16px;background:var(--surface2);border:1.5px solid transparent;line-height:1.3;display:flex;gap:10px;align-items:flex-start;transition:border-color .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt .l{font-family:var(--f-display);font-weight:800;color:var(--candle);flex:none;width:16px}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--candle);background:rgba(255,191,102,.12)}
.lockrow{display:flex;gap:8px}.lockrow .btn{flex:1}
.wait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.lockic{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;animation:wpop .5s}
.secret-note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mission-card{perspective:800px;height:170px}
.mc-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.mission-card.open .mc-in{transform:rotateY(180deg)}
.mc-f,.mc-b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:16px;box-sizing:border-box;gap:6px}
.mc-f{background:repeating-linear-gradient(45deg,#3d2766 0 10px,#35215a 10px 20px);align-items:center;text-align:center;border:1.5px solid var(--cupid)}
.mc-f b{font-family:var(--f-display);font-size:20px}
.mc-b{transform:rotateY(180deg);background:#f8efe4;color:var(--on-light)}
.mc-b b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.mc-b small{color:#5d4a6e}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flip{perspective:700px;min-height:150px}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.flip .fr{align-items:center;justify-content:center;background:var(--surface2);border:1.5px dashed var(--line);font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--muted)}
.flip .fr small{font-family:var(--f-body);font-size:12px;font-weight:600}
.flip .bk{transform:rotateY(180deg);background:#f8efe4;color:var(--on-light);font-size:13.5px;line-height:1.3;overflow:auto}
.flip .bk b{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.flip.pA .bk{box-shadow:inset 0 5px 0 var(--a)}.flip.pB .bk{box-shadow:inset 0 5px 0 var(--b)}
.count{text-align:center;font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--candle);min-height:36px}
.outcome{background:rgba(201,171,255,.1);border:1px dashed rgba(201,171,255,.45);border-radius:16px;padding:10px 12px;display:flex;gap:10px;animation:msgIn .4s both}
.outcome .mini{width:30px;height:30px;flex:none}
.outcome .mini svg{width:100%;height:100%}
.outcome p{font-size:14.5px}
.tray{display:flex;flex-direction:column;gap:8px}
.tray .opt[disabled]{opacity:.5}

/* souvenir & affinités */
.polaroid{background:#fbf5ee;color:var(--on-light);border-radius:6px;padding:10px 10px 14px;transform:rotate(-1.5deg);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.polaroid .pic{position:relative;height:130px;border-radius:3px;overflow:hidden}
.polaroid .pic .wall{position:absolute}
.polaroid .cap{font-family:var(--f-hand);font-size:21px;line-height:1.05;margin-top:8px}
.polaroid ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.polaroid .date{font-size:11px;color:#6b5a7a;margin-top:6px}
.mini-scene .wall{inset:0}
.mini-scene .ms-a,.mini-scene .ms-b{position:absolute;bottom:26%;width:44px;height:44px;border-radius:50%;overflow:hidden}
.mini-scene .ms-a{left:16%;box-shadow:0 0 0 2px var(--a)}.mini-scene .ms-b{right:16%;box-shadow:0 0 0 2px var(--b)}
.mini-scene .ms-a svg,.mini-scene .ms-b svg{width:100%;height:100%}
.mini-scene .mtable{position:absolute;left:-5%;right:-5%;bottom:-10%;height:40%;border-radius:50% 50% 0 0/45% 45% 0 0;background:linear-gradient(#f2e2cf,#cdb398)}
.mini-scene .mcandle{position:absolute;left:50%;bottom:16%;width:8px;height:18px;margin-left:-4px;background:#fff8ec;border-radius:2px}
.mini-scene .mcandle:before{content:"";position:absolute;left:50%;bottom:100%;width:8px;height:12px;margin-left:-4px;border-radius:50%;background:#ffc76b;box-shadow:0 0 14px 6px rgba(255,180,90,.5)}
.mini-scene.sc-terrasse .wall{background:linear-gradient(#0b1030,#4b2d6e)}
.mini-scene.sc-cuisine .wall{background:linear-gradient(#e7eef0,#c7d3d7)}
.mini-scene.sc-karaoke .wall{background:radial-gradient(circle at 30% 70%,rgba(255,64,200,.5),transparent 50%),#1a0b2e}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--candle);line-height:1;font-variant-numeric:tabular-nums}
.sig{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.sig li{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.sig .pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;padding:2px 7px;border-radius:999px;background:var(--surface2)}
.sig .pt.aff{color:var(--ok)}.sig .pt.diff{color:var(--b)}
.sig small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.dims{display:flex;flex-wrap:wrap;gap:5px}
.dims span{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dims span.on{border-color:var(--candle);color:var(--ink)}
.lifeproj{border:1px solid rgba(255,211,107,.45);background:rgba(255,211,107,.08);border-radius:14px;padding:10px 12px;font-size:13.5px}
.lifeproj b{color:var(--warn)}
.disclaimer{font-size:12px;color:var(--muted)}

/* fin */
.end{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.end h2{font-size:34px;line-height:1.05}
.unlock{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place-card{border-radius:16px;padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.place-card b{font-family:var(--f-display);font-size:16px;color:var(--ink)}
.place-card.open{background:linear-gradient(135deg,rgba(255,191,102,.25),rgba(201,171,255,.25));border-color:var(--candle);color:var(--ink);animation:wpop .6s .4s both}
.cover{position:absolute;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;box-sizing:border-box}
.cover .av{width:96px;height:96px;border-radius:50%}
.cover h2{font-size:28px}
.modal{position:absolute;inset:0;z-index:55;background:rgba(10,6,18,.7);display:flex;align-items:flex-end;padding-bottom:12px;box-sizing:border-box}
.modal .box{width:100%;background:var(--plum);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto;box-sizing:border-box;animation:sheetIn .3s both}
.modal .box h3{font-size:20px}
.menu-item{text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column}
.menu-item small{color:var(--muted)}
.menu-item.danger b{color:#ff9d9d}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--on-light);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:sheetIn .3s both;max-width:90%;text-align:center}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.toggle-row .seg{grid-template-columns:repeat(3,auto)}
.toggle-row .seg button{padding:6px 10px;text-align:center}
/* v2 : animations des jeux */
.seatbub{position:absolute;top:-16px;left:50%;transform:translateX(-50%) scale(0);background:var(--ink);color:var(--on-light);font-size:15px;line-height:1;padding:5px 7px;border-radius:12px 12px 12px 4px;z-index:5;transition:transform .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.seatbub.on{transform:translateX(-50%) scale(1)}
.seatbub.on.think{animation:thinkb 1.2s infinite}
@keyframes thinkb{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) translateY(-4px) scale(1)}}
.sbody{display:flex;flex-direction:column;gap:12px}
.sbody.fresh{animation:stepIn .38s cubic-bezier(.2,.9,.2,1) both}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}}
.sbody.fresh .opt{animation:optIn .45s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes optIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
.opt{position:relative;overflow:hidden}
.opt .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--candle)}
.opt.arming .bar{animation:arm var(--arm,1300ms) linear forwards}
@keyframes arm{to{width:100%}}
.opt.arming{animation:pick .35s}
@keyframes pick{40%{transform:scale(1.03)}}
.opt .chk{margin-left:auto;align-self:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--on-light);transition:all .2s}
.opt[aria-pressed="true"] .chk{background:var(--candle);border-color:var(--candle)}
.tap-hint{font-size:12px;color:var(--muted);text-align:center}
.lockic{animation:lockDrop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes lockDrop{from{transform:translateY(-34px) scale(.4);opacity:0}}
.duo-status{display:flex;gap:28px;justify-content:center}
.ds{display:flex;flex-direction:column;align-items:center;gap:6px}
.ds .av{width:52px;height:52px;border-radius:50%;transition:all .3s}
.ds .st{font-size:12.5px;font-weight:600;color:var(--muted)}
.ds.ok .st{color:var(--ok)}
.ds.ok .av{box-shadow:0 0 0 3px var(--ok)}
.ds.wait .av{animation:thinkp 1.4s infinite}
@keyframes thinkp{50%{opacity:.5;transform:scale(.94)}}
.flip.deal.pA{animation:dealL .55s cubic-bezier(.2,.9,.2,1) both}
.flip.deal.pB{animation:dealR .55s .12s cubic-bezier(.2,.9,.2,1) both}
@keyframes dealL{from{transform:translateX(-70px) rotate(-14deg);opacity:0}}
@keyframes dealR{from{transform:translateX(70px) rotate(14deg);opacity:0}}
.flip.on .bk{animation:glowc 1.1s .5s}
@keyframes glowc{30%{filter:brightness(1.12);box-shadow:0 0 0 3px var(--candle),0 0 30px rgba(255,191,102,.6)}}
.flip.good .bk{background:#e2f9e8}.flip.bad .bk{background:#fbe6e8}
.verdict{font-weight:700;font-size:13px}
.count span{display:inline-block;animation:cnt .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes cnt{from{transform:scale(2.6);opacity:0}}
.reveal{position:relative}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--f-display);font-weight:800;font-size:26px;white-space:nowrap;color:var(--on-light);background:var(--ok);padding:4px 16px;border-radius:12px;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}}
.banner{display:flex;align-items:center;justify-content:center;gap:14px;font-size:38px;height:72px;border-radius:18px;background:var(--surface2);flex:none}
.banner span{display:inline-block;animation:wob 1.1s ease-in-out infinite}
.banner span:nth-child(2){animation-delay:.18s}.banner span:nth-child(3){animation-delay:.36s}
@keyframes wob{25%{transform:rotate(-12deg) translateY(-3px)}75%{transform:rotate(12deg)}}
.qcard{background:#f8efe4;color:var(--on-light);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.sbody.fresh .qcard{animation:deal .6s cubic-bezier(.2,.9,.2,1) both}
.qcard .qn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6b5a7a;font-weight:600}
.qcard b{font-family:var(--f-display);font-size:22px;line-height:1.15}
.qcard small{color:#6b5a7a;font-size:12.5px}
@keyframes deal{from{transform:translate(140px,-50px) rotate(20deg);opacity:0}}
.pips{display:flex;gap:5px;align-items:center;margin-left:auto}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface2);transition:all .3s}
.pips i.done{background:var(--candle)}.pips i.cur{background:var(--cupid);transform:scale(1.35)}
.stitle{left:0;right:0;top:38%;z-index:13;text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--ink);background:linear-gradient(90deg,transparent,rgba(20,13,34,.88) 18%,rgba(20,13,34,.88) 82%,transparent);padding:10px 0;animation:stitle 2.3s cubic-bezier(.2,.9,.2,1) both;pointer-events:none}
.stitle small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cupid);font-weight:600}
@keyframes stitle{0%{opacity:0;transform:translateX(-45%)}18%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(45%)}}
.mission-card{cursor:pointer}
.info-steps{display:flex;gap:8px}
.info-steps span{flex:1;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:8px;text-align:center;animation:optIn .45s both;animation-delay:calc(var(--i)*90ms + 150ms)}
.info-steps b{display:block;font-size:20px}
/* v3 : questionnaire et compatibilité */
.signup{display:flex;flex-direction:column;gap:14px}
.sq-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sq-card.in-r{animation:sqR .45s cubic-bezier(.2,.9,.2,1) both}.sq-card.in-l{animation:sqL .45s cubic-bezier(.2,.9,.2,1) both}
@keyframes sqR{from{opacity:0;transform:translateX(50px) rotate(3deg)}}@keyframes sqL{from{opacity:0;transform:translateX(-50px) rotate(-3deg)}}
.sq-card h2{font-size:26px;line-height:1.1}
.scale{display:flex;justify-content:space-between;align-items:center;position:relative;padding:6px 4px}
.scale:before{content:"";position:absolute;left:22px;right:22px;top:50%;height:3px;background:var(--surface2);border-radius:3px}
.scale button{position:relative;width:36px;height:36px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1);font-weight:700;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--candle);border-color:var(--candle);color:var(--on-light);transform:scale(1.3);box-shadow:0 0 0 6px rgba(255,191,102,.18)}
.scale.off{opacity:.3;pointer-events:none}
.ends{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--muted)}
.ends span:last-child{text-align:right}
.imp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imp>span{font-size:13px;color:var(--muted);margin-right:4px}
.pill{padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:13px;border:1.5px solid transparent;transition:all .2s}
.pill[aria-pressed="true"]{border-color:var(--cupid);background:rgba(201,171,255,.16);color:var(--ink)}
.pill.hard[aria-pressed="true"]{border-color:#ff9d9d;background:rgba(255,120,120,.14)}
.optin{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface2);padding:10px 12px;border-radius:14px}
.optin input{width:18px;height:18px;margin-top:1px;accent-color:var(--cupid);flex:none}
.deal-row{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.deal-row:last-child{border-bottom:0;padding-bottom:0}
.deal-row b{font-size:15px}
.navrow{display:flex;gap:8px}.navrow .btn{flex:1}
.linkbtn{color:var(--cupid);font-size:13px;text-decoration:underline;align-self:center;padding:6px}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--candle);font-variant-numeric:tabular-nums}
.compat{display:flex;flex-direction:column;gap:14px}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--muted)}
.conf i{width:18px;height:6px;border-radius:3px;background:var(--surface2)}
.conf i.on{background:var(--ok)}
.dimrows{display:flex;flex-direction:column;gap:10px}
.dimrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.dimrow .tr{grid-column:1/3;position:relative;height:14px}
.dimrow .tr:before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--surface2);border-radius:2px}
.dimrow .dot{position:absolute;top:1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--surface);animation:dotIn .7s cubic-bezier(.3,1.4,.5,1) both}
.dimrow .dot.a{background:var(--a)}.dimrow .dot.b{background:var(--b)}
@keyframes dotIn{from{transform:scale(0);opacity:0}}
.dimrow .w{color:var(--muted);font-size:11.5px}
.dimrow.skip{color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.alert{border-radius:14px;padding:10px 12px;font-size:13.5px;border:1px solid}
.alert.amber{border-color:rgba(255,211,107,.5);background:rgba(255,211,107,.08)}
.alert.red{border-color:rgba(255,130,130,.6);background:rgba(255,120,120,.1)}
.alert.ok{border-color:rgba(138,240,181,.45);background:rgba(138,240,181,.07)}
.alert b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.alert.amber b{color:var(--warn)}.alert.red b{color:#ff9d9d}.alert.ok b{color:var(--ok)}
.teaser{display:flex;align-items:center;gap:12px;background:var(--plum);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.teaser .bigscore{font-size:40px}
.teaser p{margin:0;font-size:13px;color:var(--muted)}

function cyc(side,key){const arr=BOT[side][key];const k=side+key;S.botIdx[k]=(S.botIdx[k]||0)+1;return arr[(S.botIdx[k]-1)%arr.length]}
function botRespond(text){
  const side=other(S.me);
  if(S.mission&&S.mission.active){missionBot(text);return}
  if(S.negotiate){S.negotiate=false;go(botSay(pick(["Ok, je te laisse gagner… mais je choisis le dessert.","Argument recevable. Je réfléchis en revotant.","Tu négocies comme une pro, c'est inquiétant."]).replace('une pro',side==='A'?'un pro':'une pro')));return}
  const n=norm(text);
  S.factsUsed=S.factsUsed||{};
  const fact=(FACTS[side]||[]).find(([re],i)=>!S.factsUsed[side+i]&&re.test(n));
  if(fact){S.factsUsed[side+FACTS[side].indexOf(fact)]=true;go(botSay(fact[1]));return}
  let r;
  if(/^(salut|coucou|bonjour|bonsoir|hello|hey|yo)\b/.test(n)&&!S.greeted){S.greeted=true;r=cyc(side,'greet')}
  else if(text.includes('?'))r=cyc(side,'ans')+(Math.random()<.45?' '+cyc(side,'ask'):'');
  else r=cyc(side,'react')+(Math.random()<.5?' '+cyc(side,'ask'):'');
  go(botSay(r));
}

  const b=other(S.me);if(!sh.picks[S.me]||sh.picks[b])return;
  const g=S.gen;setTimeout(()=>{if(g!==S.gen||S.sheet!==sh||sh.picks[b])return;
    const opts=sh.options(b);sh.picks[b]=(sh.bot?sh.bot(b,sh,opts):null)||pick(opts);seatBub(b,'🔒');sh._v++;checkBoth(sh);},1100+Math.random()*1300);
}
function checkBoth(sh){if(sh.picks.A&&sh.picks.B){const r={...sh.picks};setTimeout(()=>sh.res(r),S.mode==='solo'?650:250);if(S.sheet===sh)renderSheet()}else if(S.sheet===sh)renderSheet()}
function reveal(o){return new Promise(res=>{openSheet({type:'reveal',...o,res,flipped:false});})}
function minimize(v){S.minimized=v;renderSheet()}

  if(!t){b.classList.remove('on','think');return}b.textContent=t;b.classList.remove('on','think');void b.offsetWidth;b.classList.add('on');if(think)b.classList.add('think')}

function armPick(sh,i,btn){
  if(sh.picks[S.me])return;
  if(sh.sel===i&&sh.armT){lockNow(sh);return}
  clearTimeout(sh.armT);sh.sel=i;sh.armWho=S.me;
  document.querySelectorAll('.sbody .opt').forEach((b,j)=>{b.setAttribute('aria-pressed',String(j===i));b.classList.remove('arming')});
  const ms=sh.oneTap?380:1300;btn.style.setProperty('--arm',ms+'ms');void btn.offsetWidth;btn.classList.add('arming');
  sh.armT=setTimeout(()=>{if(S.sheet===sh&&!sh.picks[S.me]&&sh.armWho===S.me)lockNow(sh)},ms);
}
function lockNow(sh){clearTimeout(sh.armT);sh.armT=null;if(sh.sel==null)return;const o=sh.options(S.me)[sh.sel];sh.picks[S.me]=o;sh.sel=null;sh._v++;seatBub(S.me,'🔒');checkBoth(sh);scheduleBot();}

function outcomeHTML(t){return `<div class="outcome">${CUPID_MINI}<p>${t}</p></div>`}
async function runReveal(sh){

  ['A','B'].forEach(p=>{const f=$('#flip'+p);if(f){f.classList.remove('deal');f.classList.add('on');if(sh.cls&&sh.cls[p])f.classList.add(sh.cls[p])}});
  if(sh.emo){seatBub('A',sh.emo.A);seatBub('B',sh.emo.B)}else clearBubs();

  if(sh.stamp){$('#revealbox')?.insertAdjacentHTML('beforeend',`<div class="stamp">${sh.stamp}</div>`);burst(50,45,26)}
  if(sh.outcome&&$('#outc')){$('#outc').innerHTML=outcomeHTML(sh.outcome)}

/* ============ Compatibilité : poids guidés par la recherche ============
   Valeurs et projets 35 % · personnalité (énergie sociale, imagination, organisation) 20 % · dynamique d'attachement 20 % · humour 25 %.
   Si l'un des deux juge l'humour « Essentiel », l'humour passe à 30 % et les valeurs à 30 %.
   La similarité de personnalité prédit peu la satisfaction (Dyrenforth et al., 2010) : elle pèse moins que les valeurs.
   Bienveillance et stabilité émotionnelle ne servent pas à classer les gens : elles restent dans ton profil privé. */
const ansOf=id=>S.ans[id]||SIMX[id];
const nameOf=id=>P[id]?P[id].name:(SUGG[S.me].find(x=>x.id===id)||{}).name||id;
const avg=x=>x.reduce((p,q)=>p+q,0)/x.length;
function traits(a){const t={E:[],A:[],C:[],N:[],O:[]};BIG.forEach(([k,sg],i)=>t[k].push(sg>0?a.big[i]:6-a.big[i]));const r={};for(const k in t)r[k]=avg(t[k]);r.N=6-r.N;return r}
function attach(a){const an=[],av=[];ATT.forEach(([k,sg],i)=>(k==='anx'?an:av).push(sg>0?a.att[i]:6-a.att[i]));return{anx:(avg(an)-1)/4,avo:(avg(av)-1)/4}}
/* Profil 4 couleurs : modèle ludique inspiré du DISC, calculé à partir des réponses Big Five (pas de questions en plus). */
const COLORS={R:{n:'Rouge',t:'Fonceur·se',c:'#ff6b5e',d:"Direct·e et décidé·e, tu aimes les défis et aller droit au but."},
  J:{n:'Jaune',t:'Enthousiaste',c:'#ffd04d',d:"Sociable et spontané·e, tu débordes d'idées et tu mets de l'ambiance."},
  V:{n:'Vert',t:'Bienveillant·e',c:'#5fd39a',d:"À l'écoute et patient·e, tu cherches l'harmonie et la confiance."},
  B:{n:'Bleu',t:'Analytique',c:'#5b9dff',d:"Réfléchi·e et précis·e, tu aimes comprendre et bien faire les choses."}};
function colorsOf(a){const t=traits(a);const raw={R:t.E+(6-t.A),J:t.E+t.A,V:(6-t.E)+t.A,B:(6-t.E)+t.C};
  const w={};let sum=0;for(const k in raw){w[k]=Math.pow(Math.max(.2,raw[k]-1.5),2);sum+=w[k]}
  const pct={};for(const k in w)pct[k]=w[k]/sum*100;
  const order=Object.keys(pct).sort((x,y)=>pct[y]-pct[x]);return{main:order[0],second:order[1],pct}}
function cchip(k,full){const c=COLORS[k];return `<span class="cchip" style="--cc:${c.c}"><i></i>${c.n}${full?' · '+c.t:''}</span>`}
const PAIRS={RR:"Deux Rouges : ça avance très vite. Pensez à laisser l'autre gagner de temps en temps.",JJ:"Deux Jaunes : ça va pétiller ! Il faudra juste que quelqu'un pense à réserver le resto.",VV:"Deux Verts : douceur et confiance. Osez dire ce que vous voulez, même si ça bouscule un peu.",BB:"Deux Bleus : un couple réfléchi et fiable. Gardez de la place pour l'imprévu.",
  JR:"Le Rouge fonce, le Jaune enflamme : beaucoup d'énergie, attention à qui parle le plus fort.",RV:"Le Rouge décide, le Vert apaise. Le Rouge gagne à ralentir, le Vert à s'affirmer.",BR:"Le Rouge tranche, le Bleu vérifie : redoutables ensemble, pensez à rire un peu.",
  JV:"Le Jaune lance les idées, le Vert apporte le calme : un duo chaleureux et rassurant.",BJ:"Le Jaune improvise, le Bleu prévoit la météo : complémentaires, si chacun respecte le rythme de l'autre.",BV:"Le Vert écoute, le Bleu structure : un duo posé et solide. Ajoutez une pincée de folie."};
function pairText(a,b){return PAIRS[[a,b].sort().join('')]}
function attLabel(x){return x.anx<.5&&x.avo<.5?'à l’aise avec la proximité':x.anx>=.5&&x.avo<.5?'en quête de réassurance':x.anx<.5?'attaché·e à ton indépendance':'partagé·e entre proximité et distance'}
function humourOf(a){const s=HSTY.map((x,k)=>(a.hum[k]+a.hum[k+5])/2);const o=s.map((v,k)=>k).sort((x,y)=>s[y]-s[x]);return{s,main:o[0],second:o[1]}}
function compatFor(a,b,games){
  const rows=[];let vw=0,vs=0;
  VAL.forEach((v,i)=>{if(i===4)return;const sim=1-Math.abs(a.val[i]-b.val[i])/4,w=(a.imp[i]+b.imp[i])/2;vw+=w;vs+=w*sim;rows.push({lab:v.k,va:a.val[i],vb:b.val[i],sim,w})});
  if(a.intim!=null&&b.intim!=null){const sim=1-Math.abs(a.intim-b.intim)/4;vw+=2;vs+=2*sim;rows.push({lab:'Intimité',va:a.intim,vb:b.intim,sim,w:2})}else rows.push({lab:'Intimité',skip:true});
  const V=vw?vs/vw:.5;
  const ta=traits(a),tb=traits(b);let ps=0;['E','O','C'].forEach(k=>{const sim=1-Math.abs(ta[k]-tb[k])/4;ps+=sim;rows.push({lab:TRAITS[k][0],va:ta[k],vb:tb[k],sim,w:1})});const Pp=ps/3;
  const aa=attach(a),ab=attach(b),D=1-Math.max(aa.anx*ab.avo,ab.anx*aa.avo);
  const ha=humourOf(a),hb=humourOf(b);let hs=0;HSTY.forEach((x,k)=>{const sim=1-Math.abs(ha.s[k]-hb.s[k])/4;hs+=sim;rows.push({lab:'Rire · '+x.n,va:ha.s[k],vb:hb.s[k],sim,w:1})});
  const HV=1-Math.abs(a.val[4]-b.val[4])/4;rows.push({lab:'Rire ensemble au quotidien',va:a.val[4],vb:b.val[4],sim:HV,w:(a.imp[4]+b.imp[4])/2});
  const H=.75*hs/5+.25*HV,hEss=a.imp[4]===3||b.imp[4]===3,wH=hEss?.30:.25,wV=hEss?.30:.35;
  const shared=HSTY.map((x,k)=>k).filter(k=>ha.s[k]>=3.5&&hb.s[k]>=3.5);
  const base=100*(wV*V+.20*Pp+.20*D+wH*H);
  let adj=0;if(games){S.sig.forEach(x=>adj+=x.pts);adj=Math.max(-10,Math.min(10,adj))}
  const score=Math.max(5,Math.min(97,Math.round(base+adj)));
  const parts=[['Humour',H,wH*100],['Valeurs et projets',V,wV*100],['Personnalité',Pp,20],['Dynamique de couple',D,20]];
  const nG=games?S.sig.length:0,conf=games&&nG>=4?['Bonne',3]:['Moyenne',2];
  return {score,base:Math.round(base),adj,rows,parts,conf,nG,D,H,hEss,shared,ha,hb};
}
function compat(g){return compatFor(S.ans.A,S.ans.B,g)}
function alertsFor(x,y){
  const out=[],a=ansOf(x),b=ansOf(y),W=DEAL[0].opts,nx=nameOf(x),ny=nameOf(y);
  const wa=a.deal.wish,wb=b.deal.wish;
  if(wa!==wb){const hard=a.hard.wish||b.hard.wish,opp=(wa===0&&wb===1)||(wa===1&&wb===0);
    out.push({lvl:hard&&opp?'red':'amber',t:hard&&opp?'Incompatibilité importante : enfants':'À discuter : enfants',txt:`${nx} : « ${W[wa]} », ${ny} : « ${W[wb]} ».${opp?' Vos projets vont dans des sens opposés.':' Ce n’est pas un verdict, c’est une conversation à avoir.'}${hard?' Marqué comme non négociable.':''}`});}
  [[x,y],[y,x]].forEach(([u,v])=>{const pv=ansOf(u).deal.parent;
    if(HASKIDS[v]&&pv>0){const red=pv===2||ansOf(u).hard.parent;out.push({lvl:red?'red':'amber',t:red?'Incompatibilité importante : enfants déjà là':'À discuter : enfants déjà là',txt:`${nameOf(v)} a déjà un enfant, et ${nameOf(u)} a répondu « ${DEAL[1].opts[pv]} ».`})}});
  if(!out.length)out.push({lvl:'ok',t:'Projets de vie',txt:'Aucun point bloquant sur les enfants et la distance d’après vos réponses.'});
  else out.push({lvl:'ok',t:'Distance',txt:`Environ ${DISTKM} km entre vous : compatible avec vos critères.`});
  return out;
}
function lifeAlerts(){return alertsFor('A','B')}
function explainLine(c){
  const ps=[...c.parts].sort((x,y)=>y[1]-x[1]);
  const close=ps.filter(x=>x[1]>=.78).slice(0,2).map(x=>x[0].toLowerCase());
  const far=ps.filter(x=>x[1]<.65).slice(-2).map(x=>x[0].toLowerCase());
  return `${close.length?`Proches sur : ${close.join(', ')}`:'Pas de point très proche'}${far.length?`. Plus différents sur : ${far.join(', ')}`:''}.`;
}
function alertsHTML(){return lifeAlerts().map(x=>`<div class="alert ${x.lvl}"><b>${x.t}</b>${x.txt}</div>`).join('')}
const METHOD=`<details class="method"><summary>Comment ce pourcentage est calculé</summary><p>Personnalité mesurée avec le <a href="https://pubmed.ncbi.nlm.nih.gov/16768595/" target="_blank" rel="noopener">Mini-IPIP</a> (Donnellan et al., 2006, items du domaine public, traduction libre non validée). Attachement inspiré des dimensions anxiété et évitement de l'<a href="https://novopsych.com/assessments/formulation/experience-in-close-relationship-scale-short-form-ecr-s/" target="_blank" rel="noopener">ECR-S</a> (Wei et al., 2007). Humour : 10 blagues maison notées, réparties en 5 styles inspirés des travaux de Martin et al. (2003, <a href="https://doi.org/10.1016/S0092-6566(02)00534-2" target="_blank" rel="noopener">Humor Styles Questionnaire</a>) et des tests d'appréciation de blagues de Ruch, sans reprendre leurs items. Une méta-analyse (Hall, 2017) relie la satisfaction en couple à un humour partagé et bienveillant plus qu'au fait d'« être drôle » : on compare donc vos styles, pas votre niveau d'humour. Poids : humour 25 % (30 % si l'un de vous le juge essentiel), valeurs et projets 35 % (30 % dans ce cas), personnalité 20 %, dynamique d'attachement 20 %, puis un ajustement de ±10 points au plus par les jeux (les moments de rire partagé comptent un peu plus). La recherche montre que la ressemblance de personnalité prédit peu la satisfaction d'un couple (Dyrenforth et al., 2010) et que ce qui compte le plus se construit dans la relation elle-même (<a href="https://socialinteractionlab.psych.umn.edu/sites/socialinteractionlab.psych.umn.edu/files/2020-12/joel_et_al._pnas_2020.pdf" target="_blank" rel="noopener">Joel et al., 2020</a>, 11 196 couples). Les 4 couleurs (inspirées du DISC) sont calculées à partir des mêmes réponses et servent seulement à raconter vos styles. Ce taux est donc un outil de conversation, pas une prédiction.</p></details>`;
function humBoxHTML(c,withGames){const m=S.memo;const g=[];
  if(withGames&&m.rire)g.push(`${m.rire.sync}/3 réactions synchro au fou rire`);

  <span class="hint" style="font-size:12.5px">${P.A.name} : ${HSTY[c.ha.main].n.toLowerCase()} · ${P.B.name} : ${HSTY[c.hb.main].n.toLowerCase()}${g.length?' · '+g.join(' · '):''}</span></div>`}

  return `<div class="compat"><div class="score"><b class="bigscore" data-count="${c.score}">${c.score}</b><span>/100 · compatibilité indicative</span></div>

function missionTrack(from,text){
  const m=S.mission;const n=norm(text);

function missionBot(text){
  const side=other(S.me),m=S.mission;
  if(side==='A'){
    const line=MLINES.A[Math.min(m.botStep++,MLINES.A.length-1)];
    const pre=text.includes('?')?pick(["Hmm, bonne question. ","Je vais répondre de façon mystérieuse. ","",""]):pick(["Haha. ","J'aime bien. ","",""]);
    go(botSay(pre+line));
  }else{
    if(PASSION.test(norm(text))&&!m.botFound){m.botFound=true;go(botSay("Attends… tu répares des vieux livres ?! C'est la chose la plus classe que j'ai entendue cette année."));return}
    const line=MLINES.B[m.botStep++%MLINES.B.length];
    go(botSay(pick(["Haha, noté. ","Intéressant… ","Ok, j'adore. ",""])+line));
  }
}

/* ============ Boucle : minuteur, relances, propositions ============ */
const RELANCES=["Petite relance : quel est l'objet le plus absurde que vous refusez de jeter ?","Défi express : décrivez votre week-end idéal en trois emojis. Pas de triche.","Question à deux balles (mais je les ai) : plutôt plan précis ou « on verra bien » ?","Allez, chacun raconte son talent caché le plus inutile.","Si cette soirée était un film, ce serait quel genre ?"];
setInterval(()=>{
  if(S.phase!=='room')return;
  const left=Math.max(0,900-Math.floor((Date.now()-S.t0)/1000));
  const t=$('#timer');if(t)t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  if(left===0&&!S.timeUp){S.timeUp=true;cupid("Les 15 minutes sont passées… mais personne ne vous met dehors. Demandez l'addition quand vous voulez.",{force:true})}
  const m=S.mission;
  if(m&&m.active){renderMission();
    if(Date.now()>=m.endsAt){m.finish&&m.finish()}
    else if(S.mode==='solo'&&Date.now()-S.lastMsgAt>16000&&Date.now()-m.lastBot>16000){m.lastBot=Date.now();missionBot('')}
    return}
  if(S.busy||S.sheet||S.ended||S.cover)return;
  if(S.finaleAt&&Date.now()>S.finaleAt&&!S.cupidPaused){go(finale());return}
  if(S.cupidPaused)return;
  const next=ORDER.find(k=>!S.done[k]);
  const since=Date.now()-S.lastGameAt;
  if(next&&((S.msgSinceGame>=4&&since>12000)||since>(S.stage===0?14000:45000))){go(proposeGame(next));return}
  if(Date.now()-S.lastMsgAt>35000){S.lastMsgAt=Date.now();cupid(RELANCES[S.relanceIdx++%RELANCES.length])}
},1000);

    case 'talk':closeModal();talkModal(b.dataset.by,+b.dataset.p);break;
    case 'icesend':{const k=b.dataset.by,n=authName(k);closeModal();
      if(k==='O'){toast(`Demande envoyée à ${n}.`);const g=S.gen;setTimeout(()=>{if(g!==S.gen||S.phase!=='feed')return;modal(`<h3>${n} a accepté ! 🎉</h3><p style="margin:0">Vous riez des mêmes choses : Cupidon vous propose de continuer au restaurant, avec les mini-jeux.</p><div class="lockrow"><button class="btn ghost" data-act="closemodal">Plus tard</button><button class="btn primary" data-act="openprofile">Voir son profil</button></div>`)},1600)}
      else toast(`Demande envoyée à ${n} (profil simulé).`);break}
    case 'flipcard':$('#mcard')?.classList.toggle('open');break;
    case 'revealnext':if(sh&&sh.type==='reveal'){const r=sh.res;S.sheet=null;r();setTimeout(renderSheet,0)}break;
    case 'mend':if(S.mission&&S.mission.finish)S.mission.finish();break;
    case 'replay':{S=fresh(S);renderProfile();break}
    case 'replayother':{const k={...S,me:other(S.me)};S=fresh(k);renderProfile();break}
  }
});
renderHome();
</script>

</body>
</html>
